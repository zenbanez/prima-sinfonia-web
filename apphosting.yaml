# App Hosting build and runtime config. These are the public Firebase web
# config values (they ship to every browser). Committed so every deploy has
# them: the CLI skips gitignored files (WS-0068/D-002 deploy incident).
# Never put a real secret here; use `secret:` references for those.
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDz9Wi_UAkA6fY4AEyE4AuN7_WxtwHju1Q"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "prima-sinfonia.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "prima-sinfonia"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "prima-sinfonia.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "171558431566"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:171558431566:web:5cfe953b51ad9b3b030c1f"
    availability:
      - BUILD
      - RUNTIME
